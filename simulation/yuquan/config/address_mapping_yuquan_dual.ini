# DFI virtual RAM address mapping for the dual-instance YuQuan wrapper.
#
# The wrapper routes external byte bit 6 to the YuQuan channel select, then
# removes that bit before passing the local address to each mc_top_yuquan.
# YuQuan ADDRMAP mode 3 maps the local address as:
#   byte bit 5       -> 32B DFI beat within a 64B cache line
#   byte bits 7:6    -> bg[1:0]
#   byte bits 14:8   -> col[6:0]
#   byte bits 16:15  -> bank[1:0]
#   byte bits 32:17  -> row[15:0]

[ram]
size = 16G

[address]
order = row[15:0], bank[1:0], col[6:0], bg[1:0], channel[0]
